<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Earning App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>💰 Earn Coins</h1>

  <div class="card">
    <h2 id="username">User</h2>
    <p>Balance</p>
    <h1 id="balance">0</h1>
  </div>

  <div class="buttons">
    <button onclick="watchAd()">🎥 Watch Ad</button>

    <button onclick="dailyBonus()">🎁 Daily Bonus</button>

    <button onclick="copyReferral()">👥 Referral</button>
  </div>

  <div class="history">
    <h3>Activity</h3>
    <ul id="activity"></ul>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
