<!DOCTYPE html>
<html>
<head>
  <title>My Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body{
      background:#111;
      color:white;
      text-align:center;
      font-family:Arial;
      padding-top:50px;
    }

    button{
      padding:15px 25px;
      border:none;
      border-radius:10px;
      background:#0088cc;
      color:white;
      font-size:18px;
    }
  </style>
</head>
<body>

<h1>Telegram Mini App</h1>

<button onclick="showMsg()">Click Me</button>

<script>
  let tg = window.Telegram.WebApp;

  tg.expand();

  function showMsg(){
    alert("Mini App Working!");
  }
</script>

</body>
</html>
